[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neuro-tech"
version = "0.1.0"
description = "IPTU Data Pipeline - Neuro Tech Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "pandas>=2.3.3",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pillow>=10.0.0",
    "apache-airflow>=2.7.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pydeequ>=1.5.0",
    "delta-spark>=3.3.2",
]

[project.optional-dependencies]
pyspark = [
    "pyspark>=3.4.0,<4.0.0",
    "delta-spark>=3.0.0",
    "pydeequ>=1.5.0",
]

# The distribution is `neuro-tech` but the import package is `iptu_pipeline`
# under src/, so the wheel target has to be declared explicitly - hatchling
# cannot infer it from the project name.
[tool.hatch.build.targets.wheel]
packages = ["src/iptu_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + pycodestyle errors: catches real defects (undefined names,
# unused imports, syntax errors) without imposing a style rewrite on the codebase.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Imports after sys.path setup / availability guards are intentional here.
"dags/*" = ["E402"]
"src/iptu_pipeline/visualizations.py" = ["E402"]
"src/iptu_pipeline/config_example.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
